<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Aria</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f13;color:#e8e6e0;height:100vh;display:flex;flex-direction:column;overflow:hidden}

    nav{padding:0 24px;height:52px;border-bottom:1px solid #1e1e26;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#0f0f13}
    .nav-logo{font-size:16px;font-weight:500;color:#fff}
    nav a{color:#6b6b78;text-decoration:none;font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid #1e1e26;transition:all .2s}
    nav a:hover{color:#fff;border-color:#333}

    .app{display:flex;flex:1;overflow:hidden}

    /* SIDEBAR */
    .sidebar{width:230px;flex-shrink:0;background:#0f0f13;border-right:1px solid #1e1e26;display:flex;flex-direction:column;overflow:hidden}
    .sidebar-header{padding:14px}
    .new-chat-btn{width:100%;padding:9px 14px;background:#16161e;border:1px solid #1e1e26;border-radius:8px;color:#e8e6e0;font-size:13px;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px}
    .new-chat-btn:hover{border-color:#378ADD;color:#7eaaef}
    .new-chat-btn::before{content:'+';font-size:18px;font-weight:300;color:#7eaaef}
    .sidebar-section{font-size:10px;font-weight:500;color:#3a3a4e;text-transform:uppercase;letter-spacing:.08em;padding:10px 14px 6px}
    .chat-list{flex:1;overflow-y:auto;padding:4px 8px}
    .chat-list::-webkit-scrollbar{width:3px}
    .chat-list::-webkit-scrollbar-thumb{background:#1e1e26}
    .chat-item{padding:9px 10px;border-radius:8px;cursor:pointer;transition:all .15s;margin-bottom:2px;border:1px solid transparent}
    .chat-item:hover{background:#16161e;border-color:#1e1e26}
    .chat-item.active{background:#16161e;border-color:#378ADD}
    .chat-item .ci-title{font-size:13px;color:#b0aead;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chat-item .ci-date{font-size:10px;color:#3a3a4e;margin-top:2px}
    .chat-item.active .ci-title{color:#7eaaef}
    .sidebar-footer{padding:12px;border-top:1px solid #1e1e26}
    .sidebar-footer a{display:block;padding:8px 10px;border-radius:8px;color:#6b6b78;text-decoration:none;font-size:12px;border:1px solid #1e1e26;text-align:center;transition:all .2s}
    .sidebar-footer a:hover{color:#fff;border-color:#333}

    /* CHAT */
    .chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .chat-header{padding:14px 24px;border-bottom:1px solid #1e1e26;display:flex;align-items:center;gap:10px;flex-shrink:0}
    .coach-info .name{font-size:15px;font-weight:500;color:#fff}
    .coach-info .status{font-size:11px;color:#378ADD;display:flex;align-items:center;gap:4px}
    .status-dot{width:6px;height:6px;border-radius:50%;background:#378ADD;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    .chat-messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
    .chat-messages::-webkit-scrollbar{width:4px}
    .chat-messages::-webkit-scrollbar-thumb{background:#1e1e26;border-radius:2px}

    .msg-wrap{display:flex;gap:10px;align-items:flex-start}
    .msg-wrap.user{flex-direction:row-reverse}
    .msg-bubble{max-width:72%;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.65;white-space:pre-wrap}
    .msg-bubble.aria{background:#16161e;border:1px solid #1e1e26;color:#e8e6e0;border-radius:4px 14px 14px 14px}
    .msg-bubble.user{background:#16161e;border:1px solid #378ADD;color:#e8e6e0;border-radius:14px 4px 14px 14px}
    .msg-bubble.typing{color:#6b6b78;font-style:italic}

    .suggestions{padding:0 24px 12px;display:flex;flex-wrap:wrap;gap:8px;flex-shrink:0}
    .sug{padding:7px 14px;border-radius:20px;border:1px solid #1e1e26;background:transparent;color:#7eaaef;font-size:12px;cursor:pointer;transition:all .2s}
    .sug:hover{border-color:#378ADD;background:#16161e}

    .input-area{padding:14px 24px;border-top:1px solid #1e1e26;flex-shrink:0}
    .input-wrap{display:flex;gap:10px;align-items:flex-end;background:#16161e;border:1px solid #1e1e26;border-radius:12px;padding:10px 14px;transition:border .2s}
    .input-wrap:focus-within{border-color:#378ADD}
    textarea{flex:1;background:transparent;border:none;color:#e8e6e0;font-size:14px;font-family:inherit;resize:none;height:22px;max-height:120px;outline:none;line-height:1.5}
    textarea::placeholder{color:#3a3a4e}
    .send-btn{width:34px;height:34px;background:#378ADD;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
    .send-btn:hover{background:#4a9eff}
    .send-btn:disabled{background:#1e1e26;cursor:not-allowed}
    .send-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    /* RIGHT PANEL */
    .right-panel{width:260px;flex-shrink:0;background:#0f0f13;border-left:1px solid #1e1e26;overflow-y:auto;padding:16px}
    .right-panel::-webkit-scrollbar{width:3px}
    .right-panel::-webkit-scrollbar-thumb{background:#1e1e26}
    .rp-title{font-size:10px;font-weight:500;color:#6b6b78;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
    .rp-section{margin-bottom:20px}
    .rp-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
    .rp-stat{background:#16161e;border:1px solid #1e1e26;border-radius:8px;padding:10px 12px}
    .rp-stat .rl{font-size:10px;color:#6b6b78;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
    .rp-stat .rv{font-size:18px;font-weight:500;color:#fff}
    .rp-stat .rsub{font-size:10px;color:#378ADD;margin-top:2px}
    .rp-chart-card{background:#16161e;border:1px solid #1e1e26;border-radius:8px;padding:12px;margin-bottom:8px}
    .rp-chart-label{font-size:11px;color:#6b6b78;margin-bottom:8px}
    .rp-chart-wrap{position:relative;height:90px}
    .evento-mini{background:#16161e;border:1px solid #1e1e26;border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
    .em-dias{font-size:20px;font-weight:500;color:#fff;min-width:26px;text-align:center}
    .em-dias span{display:block;font-size:9px;color:#6b6b78;font-weight:400}
    .em-info .en{font-size:12px;color:#e8e6e0}
    .em-badge{font-size:10px;margin-top:2px;display:inline-block;padding:1px 6px;border-radius:10px}
    .em-badge.competencia{background:#1e2a1e;color:#7ecb8f}
    .em-badge.examen,.em-badge.parcial{background:#2a221e;color:#f0c040}
    .em-badge.otro{background:#1e222a;color:#7eaaef}

    /* Tablas y ajustes chat*/
    .msg-bubble.aria table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
    .msg-bubble.aria th{text-align:left;color:#6b6b78;padding:6px 10px;border-bottom:1px solid #1e1e26;font-weight:400}
    .msg-bubble.aria td{padding:6px 10px;border-bottom:1px solid #1a1a22}
    .msg-bubble.aria tr:last-child td{border-bottom:none}
    .msg-bubble.aria ul,.msg-bubble.aria ol{padding-left:20px;margin:6px 0}
    .msg-bubble.aria li{margin-bottom:4px;line-height:1.5}
    .msg-bubble.aria strong{color:#fff;font-weight:500}
    .msg-bubble.aria h2,.msg-bubble.aria h3{color:#fff;font-weight:500;margin:12px 0 6px;font-size:14px}
    .msg-bubble.aria hr{border:none;border-top:1px solid #1e1e26;margin:10px 0}
    .msg-bubble.aria p{margin-bottom:8px}
    .msg-bubble.aria p:last-child{margin-bottom:0}

    @media(max-width:900px){.right-panel{display:none}}
    @media(max-width:600px){.sidebar{display:none}}
  </style>
</head>
<body>

<nav>
  <span class="nav-logo">Coach Aria</span>
  <a href="/">Training Hub</a>
</nav>

<div class="app">

  <div class="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" onclick="nuevoChat()">New conversation</button>
    </div>
    <div class="sidebar-section">Recent</div>
    <div class="chat-list" id="chat-list"></div>
    <div class="sidebar-footer">
      <a href="/">Training Hub</a>
    </div>
  </div>

  <div class="chat-main">
    <div class="chat-header">
      <div class="coach-info">
        <div class="name">Coach Aria</div>
        <div class="status"><span class="status-dot"></span>Online · acceso completo a tus datos</div>
      </div>
    </div>

    <div class="chat-messages" id="chat"></div>

    <div class="suggestions" id="sugerencias">
      <button class="sug" onclick="enviarSugerencia(this)">Analiza mi semana de entrenamiento</button>
      <button class="sug" onclick="enviarSugerencia(this)">Recomiendame el entreno de hoy</button>
      <button class="sug" onclick="enviarSugerencia(this)">Como va mi cintilla iliotibial?</button>
      <button class="sug" onclick="enviarSugerencia(this)">Tips de nutricion para mis entrenamientos</button>
      <button class="sug" onclick="enviarSugerencia(this)">Armame un split semanal</button>
      <button class="sug" onclick="enviarSugerencia(this)">Cuando empiezo a nadar y montar bici?</button>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="input" placeholder="Preguntale a Coach Aria..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send" onclick="enviar()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="rp-section">
      <div class="rp-title">This month</div>
      <div class="rp-stats-grid" id="rp-stats"></div>
    </div>
    <div class="rp-section">
      <div class="rp-title">Distance — last 8 weeks</div>
      <div class="rp-chart-card">
        <div class="rp-chart-wrap"><canvas id="rpChartKm"></canvas></div>
      </div>
    </div>
    <div class="rp-section">
      <div class="rp-title">Training hours — last 8 weeks</div>
      <div class="rp-chart-card">
        <div class="rp-chart-wrap"><canvas id="rpChartHoras"></canvas></div>
      </div>
    </div>
    <div class="rp-section">
      <div class="rp-title">Heart rate — last 30 days</div>
      <div class="rp-chart-card">
        <div class="rp-chart-wrap"><canvas id="rpChartHR"></canvas></div>
      </div>
    </div>
    <div class="rp-section">
      <div class="rp-title">Upcoming events</div>
      <div id="rp-eventos"></div>
    </div>
  </div>

</div>

<script>
const STORAGE_KEY = 'aria_chats_v2'

function cargarChats(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [] }
  catch{ return [] }
}
function guardarChats(c){ localStorage.setItem(STORAGE_KEY, JSON.stringify(c)) }

let chats = cargarChats()
let chatActivo = null
let historial = []

function nuevoChat(){
  const id = Date.now().toString()
  const chat = {
    id,
    titulo: 'New conversation',
    fecha: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}),
    mensajes: []
  }
  chats.unshift(chat)
  guardarChats(chats)
  activarChat(id)
}

function activarChat(id){
  chatActivo = id
  const chat = chats.find(c=>c.id===id)
  historial = chat ? chat.mensajes.map(m=>({role:m.role,content:m.content})) : []
  renderChat(chat ? chat.mensajes : [])
  renderSidebar()
  document.getElementById('sugerencias').style.display = historial.length ? 'none' : 'flex'
}

function renderSidebar(){
  const list = document.getElementById('chat-list')
  if(!chats.length){
    list.innerHTML='<div style="padding:12px;font-size:12px;color:#3a3a4e;text-align:center">No conversations yet</div>'
    return
  }
  list.innerHTML = chats.map(c=>`
    <div class="chat-item ${c.id===chatActivo?'active':''}" onclick="activarChat('${c.id}')">
      <div class="ci-title">${c.titulo}</div>
      <div class="ci-date">${c.fecha}</div>
    </div>`).join('')
}

function renderChat(mensajes){
  const el = document.getElementById('chat')
  if(!mensajes.length){
    el.innerHTML=`
      <div class="msg-wrap">
        <div class="msg-bubble aria">Hola Felipe! Soy Coach Aria. Tengo acceso completo a tu historial de entrenamiento, tus workouts de fuerza y tus eventos proximos.\n\nEn que te puedo ayudar hoy?</div>
      </div>`
    return
  }
  el.innerHTML = mensajes.map(m=>`
    <div class="msg-wrap ${m.role==='user'?'user':''}">
      <div class="msg-bubble ${m.role==='user'?'user':'aria'}">${m.content}</div>
    </div>`).join('')
  el.scrollTop = el.scrollHeight
}

function autoResize(el){
  el.style.height='22px'
  el.style.height=Math.min(el.scrollHeight,120)+'px'
}

function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar()}
}

function enviarSugerencia(btn){
  document.getElementById('input').value=btn.textContent
  enviar()
}

function addMsg(content, role){
  const el = document.getElementById('chat')
  const div = document.createElement('div')
  div.className=`msg-wrap ${role==='user'?'user':''}`
  const rendered = role === 'aria' ? marked.parse(content) : content
  div.innerHTML=`<div class="msg-bubble ${role==='user'?'user':'aria'}">${rendered}</div>`
  el.appendChild(div)
  el.scrollTop=el.scrollHeight
  return div
}

async function enviar(){
  if(!chatActivo) nuevoChat()
  const input=document.getElementById('input')
  const btn=document.getElementById('send')
  const texto=input.value.trim()
  if(!texto) return

  input.value=''
  input.style.height='22px'
  btn.disabled=true
  document.getElementById('sugerencias').style.display='none'

  addMsg(texto,'user')
  const typing=addMsg('<span style="opacity:.5">Analizando tus datos de entrenamiento...</span>','aria')

  try{
    const res=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mensaje:texto,historial})
    })
    const data=await res.json()
    typing.remove()

    if(data.error){
      addMsg('Error: '+data.error,'aria')
    } else {
      addMsg(data.respuesta,'aria')
      historial.push({role:'user',content:texto})
      historial.push({role:'assistant',content:data.respuesta})
      if(historial.length>20) historial=historial.slice(-20)

      const chat=chats.find(c=>c.id===chatActivo)
      if(chat){
        chat.mensajes=historial.map(m=>({role:m.role,content:m.content}))
        if(chat.titulo==='New conversation'){
          chat.titulo=texto.slice(0,35)+(texto.length>35?'...':'')
        }
        guardarChats(chats)
        renderSidebar()
      }
    }
  } catch(err){
    typing.remove()
    addMsg('Error de conexion. Esta corriendo el servidor?','aria')
  }

  btn.disabled=false
  input.focus()
}

// Panel derecho
const rpChartOpts = {
  responsive:true, maintainAspectRatio:false,
  plugins:{legend:{display:false}},
  elements:{point:{radius:3,hoverRadius:5}},
  scales:{
    x:{ticks:{color:'#3a3a4e',font:{size:9},maxTicksLimit:4},grid:{color:'#1e1e26'}},
    y:{ticks:{color:'#3a3a4e',font:{size:9}},grid:{color:'#1e1e26'}}
  }
}

function cargarPanel(){
  fetch('/api/stats?dias=30').then(r=>r.json()).then(d=>{
    document.getElementById('rp-stats').innerHTML=`
      <div class="rp-stat">
        <div class="rl">Activities</div>
        <div class="rv">${d.total_actividades}</div>
        <div class="rsub">this month</div>
      </div>
      <div class="rp-stat">
        <div class="rl">Distance</div>
        <div class="rv">${d.distancia_total}</div>
        <div class="rsub">km total</div>
      </div>
      <div class="rp-stat">
        <div class="rl">Hours</div>
        <div class="rv">${d.tiempo_total_horas}</div>
        <div class="rsub">trained</div>
      </div>
      <div class="rp-stat">
        <div class="rl">Avg HR</div>
        <div class="rv">${d.fc_media||'-'}</div>
        <div class="rsub">bpm avg</div>
      </div>
    `
  })

  fetch('/api/distancia_semanal?tipo=all&semanas=8').then(r=>r.json()).then(data=>{
    new Chart(document.getElementById('rpChartKm'),{
      type:'line',
      data:{
        labels:data.map(d=>d.semana),
        datasets:[{
          data:data.map(d=>d.distancia),
          borderColor:'#378ADD',
          backgroundColor:'rgba(55,138,221,0.1)',
          tension:0.4, fill:true,
          pointRadius:3,
          pointBackgroundColor:'#378ADD',
          pointBorderColor:'#0f0f13',
          pointBorderWidth:2
        }]
      },
      options:rpChartOpts
    })
  })

  fetch('/api/horas_semanales?semanas=8').then(r=>r.json()).then(data=>{
    const semanas=[...new Set(data.map(d=>d.semana))].sort()
    const horas=semanas.map(s=>{
      const rows=data.filter(d=>d.semana===s)
      return Math.round(rows.reduce((a,r)=>a+r.horas,0)*10)/10
    })
    new Chart(document.getElementById('rpChartHoras'),{
      type:'line',
      data:{
        labels:semanas,
        datasets:[{
          data:horas,
          borderColor:'#7eaaef',
          backgroundColor:'rgba(126,170,239,0.1)',
          tension:0.4, fill:true,
          pointRadius:3,
          pointBackgroundColor:'#7eaaef',
          pointBorderColor:'#0f0f13',
          pointBorderWidth:2
        }]
      },
      options:rpChartOpts
    })
  })

  fetch('/api/fc_historico?tipo=all&dias=30').then(r=>r.json()).then(data=>{
    new Chart(document.getElementById('rpChartHR'),{
      type:'line',
      data:{
        labels:data.map(d=>d.fecha),
        datasets:[{
          data:data.map(d=>d.fc_media),
          borderColor:'#e07b4f',
          backgroundColor:'rgba(224,123,79,0.08)',
          tension:0.4, fill:true,
          pointRadius:2,
          pointBackgroundColor:'#e07b4f',
          pointBorderColor:'#0f0f13',
          pointBorderWidth:2
        }]
      },
      options:rpChartOpts
    })
  })

  fetch('/api/eventos').then(r=>r.json()).then(data=>{
    const el=document.getElementById('rp-eventos')
    if(!data.length){
      el.innerHTML='<div style="font-size:12px;color:#3a3a4e;padding:4px 0">No upcoming events</div>'
      return
    }
    el.innerHTML=data.slice(0,4).map(e=>`
      <div class="evento-mini">
        <div class="em-dias">${e.dias_restantes}<span>days</span></div>
        <div class="em-info">
          <div class="en">${e.nombre}</div>
          <span class="em-badge ${e.categoria}">${e.categoria}</span>
        </div>
      </div>`).join('')
  })
}

renderSidebar()
if(chats.length) activarChat(chats[0].id)
else nuevoChat()
cargarPanel()
</script>
</body>
</html>
